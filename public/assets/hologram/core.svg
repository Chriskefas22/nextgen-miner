<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">NextGen Miner holographic mining core</title>
  <desc id="desc">A futuristic cyan and violet diamond energy core with circuit geometry.</desc>
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ffaff"/>
      <stop offset=".38" stop-color="#24e8ff"/>
      <stop offset=".72" stop-color="#5b63ff"/>
      <stop offset="1" stop-color="#ee3cff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#24e8ff"/>
      <stop offset="1" stop-color="#8b3dff"/>
    </linearGradient>
    <radialGradient id="energy">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".2" stop-color="#24e8ff" stop-opacity=".8"/>
      <stop offset=".6" stop-color="#5b63ff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#5b63ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g opacity=".45" filter="url(#glow)">
    <circle cx="250" cy="250" r="145" fill="url(#energy)"/>
  </g>

  <g fill="none" stroke="url(#edge)" stroke-linejoin="round">
    <path d="M250 82 390 165 365 330 250 418 135 330 110 165Z" stroke-width="2" opacity=".35"/>
    <path d="M250 118 348 178 329 306 250 374 171 306 152 178Z" stroke-width="2" opacity=".55"/>
    <path d="M250 148 315 187 302 280 250 326 198 280 185 187Z" stroke-width="3" opacity=".75"/>
  </g>

  <g fill="none" stroke="#24e8ff" stroke-width="2" opacity=".65">
    <path d="M152 178h-42v-24H78"/>
    <path d="M348 178h42v-24h32"/>
    <path d="M171 306h-48v25H92"/>
    <path d="M329 306h48v25h35"/>
    <path d="M250 118V78h28"/>
    <path d="M250 374v43h-30"/>
  </g>

  <g fill="#24e8ff">
    <circle cx="78" cy="154" r="4"/>
    <circle cx="422" cy="154" r="4"/>
    <circle cx="92" cy="331" r="4"/>
    <circle cx="412" cy="331" r="4"/>
    <circle cx="278" cy="78" r="4"/>
    <circle cx="220" cy="417" r="4"/>
  </g>

  <g filter="url(#glow)">
    <path d="M250 145 318 185 300 278 250 320 200 278 182 185Z"
          fill="url(#core)" fill-opacity=".72" stroke="#b9fbff" stroke-width="3"/>
    <path d="M250 164 292 189 281 260 250 287 219 260 208 189Z"
          fill="#061a31" fill-opacity=".55" stroke="#24e8ff" stroke-width="2"/>
    <path d="M250 177 273 191 268 243 250 258 232 243 227 191Z"
          fill="url(#energy)" opacity=".95"/>
  </g>

  <g fill="#fff" opacity=".9">
    <circle cx="250" cy="196" r="3"/>
    <circle cx="250" cy="225" r="5"/>
    <circle cx="250" cy="254" r="3"/>
  </g>

  <text x="250" y="350" text-anchor="middle"
        fill="#8eefff" font-family="Arial, sans-serif"
        font-size="13" letter-spacing="5">N • CORE</text>
</svg>
